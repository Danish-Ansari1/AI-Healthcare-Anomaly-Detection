{% extends "base.html" %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto; padding: 20px;">
    <div style="display: flex; align-items: center; margin-bottom: 30px;">
        <i class="fas fa-cogs" style="font-size: 2rem; color: #58a6ff; margin-right: 15px;"></i>
        <h1 style="font-weight: 700; margin: 0;">System Settings</h1>
    </div>

    <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h3 style="margin-top: 0; color: #58a6ff; display: flex; align-items: center;">
            <i class="fas fa-user-md" style="margin-right: 10px;"></i> User Profile
        </h3>
        <hr style="border: 0; border-top: 1px solid #30363d; margin: 15px 0;">
        
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px; align-items: center;">
            <label style="color: #8b949e; font-weight: 500;">Full Name:</label>
            <input type="text" value="Dr. Aditi Verma" style="background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; font-size: 1rem;">
            
            <label style="color: #8b949e; font-weight: 500;">Designation/Role:</label>
            <input type="text" value="Senior Cardiologist" style="background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; font-size: 1rem;">
        </div>
    </div>

    <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h3 style="margin-top: 0; color: #ff7b72; display: flex; align-items: center;">
            <i class="fas fa-heartbeat" style="margin-right: 10px;"></i> Medical Thresholds
        </h3>
        <p style="font-size: 0.85rem; color: #8b949e; margin-bottom: 20px;">Set the limits that will trigger critical system alerts.</p>
        
        <div style="display: grid; grid-template-columns: 2fr 1.2fr 1.2fr; gap: 20px; align-items: center;">
            <span style="color: #c9d1d9;">Critical Heart Rate (BPM):</span>
            <input type="number" value="50" placeholder="Min" style="background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; text-align: center;">
            <input type="number" value="120" placeholder="Max" style="background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; text-align: center;">
            
            <span style="color: #c9d1d9;">Minimum SpO2 Level (%):</span>
            <div style="grid-column: span 2; display: flex; align-items: center;">
                <input type="number" value="92" style="background: #0d1117; border: 1px solid #30363d; color: white; padding: 10px; border-radius: 8px; width: 80px; text-align: center;">
                <span style="margin-left: 15px; color: #8b949e; font-size: 0.9rem;">(Alerts trigger below this value)</span>
            </div>
        </div>
    </div>

    <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <h3 style="margin-top: 0; color: #f2cc60; display: flex; align-items: center;">
            <i class="fas fa-bell" style="margin-right: 10px;"></i> Notification System
        </h3>
        <div style="margin-top: 20px; display: grid; gap: 15px;">
            <label style="display: flex; align-items: center; cursor: pointer; color: #c9d1d9;">
                <input type="checkbox" checked style="width: 18px; height: 18px; margin-right: 12px; accent-color: #238636;">
                Enable Real-time Sound Alerts
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; color: #c9d1d9;">
                <input type="checkbox" style="width: 18px; height: 18px; margin-right: 12px; accent-color: #238636;">
                Send Hourly Email Reports
            </label>
            <label style="display: flex; align-items: center; cursor: pointer; color: #c9d1d9;">
                <input type="checkbox" checked style="width: 18px; height: 18px; margin-right: 12px; accent-color: #238636;">
                Show Browser Push Notifications
            </label>
        </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 20px; margin-top: 20px; padding-bottom: 40px;">
        <button style="background: transparent; border: 1px solid #f85149; color: #f85149; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s;">Reset Defaults</button>
        <button style="background: #238636; border: none; color: white; padding: 12px 40px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);">Save System Configuration</button>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    input:focus { outline: none; border-color: #58a6ff !important; box-shadow: 0 0 5px rgba(88, 166, 255, 0.3); }
    button:hover { opacity: 0.8; transform: translateY(-1px); }
</style>
{% endblock %}
