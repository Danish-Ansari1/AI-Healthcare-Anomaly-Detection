{% extends "base.html" %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
        <h1 style="font-weight: 700; margin: 0; color: #ffffff;">Real-Time Anomaly Detection</h1>
        
        <div style="display: flex; align-items: center; background: rgba(35, 134, 54, 0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid #238636;">
            <div style="width: 8px; height: 8px; background: #238636; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px #238636; animation: blink 1.5s infinite;"></div>
            <span style="color: #238636; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px;">LIVE</span>
        </div>
    </div>
    <p style="color: #8b949e; margin-top: 0;">Monitoring AI predictions for Patients.</p>

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0;">
        <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d;">
            <p style="color: #8b949e; margin-bottom: 10px;">Total Patients</p>
            <h2 id="total-pts" style="font-size: 3rem; margin: 0; color: #c9d1d9;">--</h2>
        </div>
        <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d;">
            <p style="color: #8b949e; margin-bottom: 10px;">Critical Alerts</p>
            <h2 id="high-alerts" style="font-size: 3rem; margin: 0; color: #f85149;">--</h2>
        </div>
        <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d;">
            <p style="color: #8b949e; margin-bottom: 10px;">Warnings</p>
            <h2 id="med-alerts" style="font-size: 3rem; margin: 0; color: #d29922;">--</h2>
        </div>
    </div>

    <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 30px;">
        <h3 style="color: #c9d1d9; margin-bottom: 20px;">Live Heart Rate & SpO2</h3>
        <canvas id="liveChart" height="80"></canvas>
    </div>

    <div style="background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d;">
        <h3 style="color: #c9d1d9;">Live Patient Stream</h3>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead style="text-align: left; color: #8b949e; border-bottom: 1px solid #30363d;">
                <tr>
                    <th style="padding: 12px;">TIME</th>
                    <th>PATIENT ID</th>
                    <th>HEART RATE</th>
                    <th>SPO2 (%)</th>
                    <th>TEMP</th>
                    <th>BP (SYS/DIA)</th> 
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="data-table" style="color: #c9d1d9;">
                </tbody>
        </table>
    </div>

    <style>
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'Heart Rate (BPM)', data: [], borderColor: '#58a6ff', tension: 0.4, borderWidth: 2, pointRadius: 0 },
                { label: 'SpO2 (%)', data: [], borderColor: '#3fb950', tension: 0.4, borderWidth: 2, pointRadius: 0 }
            ]},
            options: { 
                responsive: true, 
                plugins: { legend: { labels: { color: '#8b949e' } } },
                scales: { 
                    y: { grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                    x: { grid: { display: false }, ticks: { color: '#8b949e' } }
                } 
            }
        });

        async function refreshData() {
            try {
                // 1. STATS UPDATE (Total, High, Med)
                const statsRes = await fetch('/api/stats');
                const statsJson = await statsRes.json();
                if (statsJson.status === 'success') {
                    document.getElementById('total-pts').innerText = statsJson.data.total_pts || 0;
                    document.getElementById('high-alerts').innerText = statsJson.data.high_alerts || 0;
                    document.getElementById('med-alerts').innerText = statsJson.data.med_alerts || 0;
                }

                // 2. VITALS TABLE & GRAPH UPDATE
                const res = await fetch('/api/vitals');
                const json = await res.json();
                const data = json.data;
                
                if (data && data.length > 0) {
                    // Update Table (Latest 10 records)
                    document.getElementById('data-table').innerHTML = data.slice(0, 10).map(row => {
                        // Color logic based on severity
                        let badgeColor = "#238636"; // Green (LOW)
                        if (row.severity === 'HIGH') badgeColor = "#da3633"; // Red
                        if (row.severity === 'MEDIUM') badgeColor = "#d29922"; // Orange

                        return `
                        <tr style="border-bottom: 1px solid #30363d; height: 50px;">
                            <td style="padding: 12px; color: #8b949e; font-size: 0.85rem;">${row.timestamp}</td>
                            <td style="color: #58a6ff; font-weight: bold;">${row.patient_id}</td>
                            <td>${Number(row.heart_rate).toFixed(1)}</td>
                            <td>${Number(row.spo2).toFixed(1)}%</td>
                            <td>${Number(row.temperature).toFixed(1)}°C</td>
                            <td style="letter-spacing: 1px;">${row.bp_sys}/${row.bp_dia}</td> 
                            <td>
                                <span style="background: ${badgeColor}; color: white; padding: 4px 12px; border-radius: 6px; 
                                             font-size: 10px; font-weight: bold; text-transform: uppercase;">
                                    ${row.severity}
                                </span>
                            </td>
                        </tr>`;
                    }).join('');

                    
                    const latest = [...data].slice(0, 20).reverse();
                    chart.data.labels = latest.map(d => d.timestamp);
                    chart.data.datasets[0].data = latest.map(d => d.heart_rate);
                    chart.data.datasets[1].data = latest.map(d => d.spo2);
                    chart.update('none'); 
                }
            } catch (e) {
                console.log("Error fetching data:", e);
            }
        }

        
        setInterval(refreshData, 2000);
        refreshData(); 
    </script>
{% endblock %}
